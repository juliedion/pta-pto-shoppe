<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to The PTA/PTO Shoppe!</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<style>
:root{--navy:#0D1B3E;--pink:#E8357A;--purple:#7B3FB5;--green:#2BA84A;--gold-light:#F5D78E;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Poppins',sans-serif;background:linear-gradient(155deg,#010D2A 0%,#0D1B3E 60%,#1a0840 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{background:white;border-radius:28px;padding:56px 48px;max-width:520px;width:100%;text-align:center;box-shadow:0 32px 80px rgba(0,0,0,0.4);}
.success-icon{font-size:64px;margin-bottom:20px;display:block;animation:pop 0.5s cubic-bezier(0.34,1.56,0.64,1) both;}
@keyframes pop{from{transform:scale(0);opacity:0;}to{transform:scale(1);opacity:1;}}
.success-eyebrow{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--green);margin-bottom:10px;}
h1{font-size:28px;font-weight:900;color:var(--navy);letter-spacing:-0.5px;margin-bottom:10px;}
.success-sub{font-size:14px;font-weight:300;color:rgba(13,27,62,0.55);line-height:1.7;margin-bottom:32px;}
.success-btn{display:inline-block;background:linear-gradient(135deg,var(--pink),var(--purple));color:white;font-family:'Poppins',sans-serif;font-size:15px;font-weight:800;padding:16px 36px;border-radius:100px;text-decoration:none;box-shadow:0 8px 28px rgba(232,53,122,0.4);transition:all 0.2s;}
.success-btn:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(232,53,122,0.55);}
.success-note{font-size:11px;color:rgba(13,27,62,0.35);margin-top:20px;line-height:1.6;}
.spinner{width:32px;height:32px;border:3px solid rgba(13,27,62,0.1);border-top-color:var(--pink);border-radius:50%;animation:spin 0.65s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="spinner" id="spinner"></div>
  <div style="font-size:13px;color:rgba(13,27,62,0.4);" id="statusText">Activating your account…</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
initFirebase();

firebase.auth().onAuthStateChanged(function(user) {
  if (!user) {
    // Not signed in — redirect to login first, then come back
    window.location.href = 'login.html?next=' + encodeURIComponent(window.location.href);
    return;
  }
  activateSubscription(user);
});

function activateSubscription(user) {
  var plan    = sessionStorage.getItem('chosenPlan')    || 'starter';
  var billing = sessionStorage.getItem('chosenBilling') || 'monthly';

  // Calculate a provisional expiry date (Stripe webhooks would normally do this)
  var exp = new Date();
  exp.setMonth(exp.getMonth() + (billing === 'annual' ? 12 : 1));

  var subData = {
    status:           'active',
    plan:             plan,
    billing:          billing,
    currentPeriodEnd: exp.toISOString(),
    activatedAt:      new Date().toISOString(),
    uid:              user.uid,
    email:            user.email
  };

  setSubscription(user.uid, subData)
    .then(function() {
      sessionStorage.removeItem('chosenPlan');
      sessionStorage.removeItem('chosenBilling');
      showSuccess(plan);
    })
    .catch(function() {
      // Even if Firestore write fails, show success and let them try dashboard
      showSuccess(plan);
    });
}

function showSuccess(plan) {
  var planLabel = plan === 'pro' ? 'Pro Board' : 'Starter';
  document.getElementById('card').innerHTML =
    '<span class="success-icon">🎉</span>'
    + '<div class="success-eyebrow">Payment confirmed</div>'
    + '<h1>You\'re all set!</h1>'
    + '<p class="success-sub">Your <strong>' + planLabel + ' Plan</strong> is active. All 10 AI tools are ready for your board. Let\'s make something great.</p>'
    + '<a href="dashboard.html" class="success-btn">Go to My Dashboard →</a>'
    + '<p class="success-note">A receipt has been sent to your email.<br>Questions? <a href="contact.html" style="color:var(--purple);">Contact us →</a></p>';
}
</script>
</body>
</html>
